[project]
name = "grade-guardian"
version = "0.1.0"
description = "Automated system to monitor student grades in Denver Public Schools via Schoology and send SMS reminders"
readme = { text = "Grade Guardian - Automated grade monitoring for DPS/Schoology", content-type = "text/plain" }
authors = [
    { name = "Devon Jones", email = "devon.jones@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "flask>=3.0.0",
    "psycopg[binary]>=3.1.0",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "python-dateutil>=2.8.0",
    "requests>=2.31.0",
]

[project.scripts]
grade-guardian = "grade_guardian:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
